<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Tech Oscilloscope Matrix</title>
<!-- Google Fonts: A highly legible, tabular monospace font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        /* Phosphor Amber Palette */
        --phosphor-main: oklch(80% 0.18 70); /* Brilliant Amber */
        --phosphor-dim: oklch(50% 0.1 70);
        --phosphor-bg: oklch(20% 0.05 70 / 0.1);
        
        --bg-color: #0c0c0c;
        --grid-line: rgba(255, 176, 0, 0.08);
        --grid-line-heavy: rgba(255, 176, 0, 0.15);
        
        --font-stack: 'JetBrains Mono', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--bg-color);
        font-family: var(--font-stack);
        color: var(--phosphor-main);
        
        /* The Millimeter Engineering Grid */
        background-image: 
            linear-gradient(var(--grid-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
            linear-gradient(var(--grid-line-heavy) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-line-heavy) 1px, transparent 1px);
        background-size: 10px 10px, 10px 10px, 50px 50px, 50px 50px;
        background-position: center center;
    }

    /* The Bento Box Matrix */
    .matrix-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        max-width: 650px;
        padding: 2rem;
    }

    /* Bento Items */
    .data-zone {
        position: relative;
        padding: 1.5rem;
        background: var(--phosphor-bg);
        
        /* 
           Technical Brackets constructed purely via CSS background gradients.
           This draws 8 individual segments to create perfect corners [ ] 
        */
        background-image: 
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main)),
            linear-gradient(var(--phosphor-main), var(--phosphor-main));
        background-repeat: no-repeat;
        background-size: 
            12px 2px, 2px 12px, /* Top Left */
            12px 2px, 2px 12px, /* Top Right */
            12px 2px, 2px 12px, /* Bottom Left */
            12px 2px, 2px 12px; /* Bottom Right */
        background-position: 
            top left, top left,
            top right, top right,
            bottom left, bottom left,
            bottom right, bottom right;
    }

    .zone-wide {
        grid-column: 1 / -1;
    }

    .zone-header {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-bottom: 1rem;
        text-shadow: 0 0 5px var(--phosphor-main);
        display: flex;
        justify-content: space-between;
    }

    /* SVG Oscilloscope Styling */
    .oscilloscope-wrapper {
        width: 100%;
        height: 120px;
        position: relative;
        border: 1px solid var(--grid-line-heavy);
        overflow: hidden;
    }

    /* The raw inline SVG */
    .osc-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Target the path to give it that heavy, bright CRT center with glowing edges */
    .osc-line {
        fill: none;
        stroke: var(--phosphor-main);
        stroke-width: 1.5;
        /* Links to the filter defined in the SVG */
        filter: url(#phosphor-bloom); 
    }

    /* Metric Typography */
    .metric-value {
        font-size: 2.5rem;
        font-weight: 400;
        /* Tabular nums keep the width of characters exactly the same so numbers don't jitter when changing */
        font-variant-numeric: tabular-nums; 
        text-shadow: 0 0 12px var(--phosphor-dim);
    }
    
    .metric-sub {
        font-size: 0.7rem;
        color: var(--phosphor-dim);
        margin-top: 0.25rem;
    }

    .blinking-cursor {
        animation: blink 1s step-end infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>
</head>
<body>

    <div class="matrix-container">
        
        <!-- Wide Oscilloscope Zone -->
        <div class="data-zone zone-wide">
            <div class="zone-header">
                <span>[ REAL-TIME_ANALYSIS ]</span>
                <span>SYNC_0x9A</span>
            </div>
            
            <div class="oscilloscope-wrapper">
                <svg class="osc-svg" viewBox="0 0 500 100" preserveAspectRatio="none">
                    <!-- SVG Filters are incredibly powerful for UI. This creates the CRT glow -->
                    <defs>
                        <filter id="phosphor-bloom" x="-20%" y="-20%" width="140%" height="140%">
                            <!-- The Blur -->
                            <feGaussianBlur stdDeviation="2.5" result="blur" />
                            <!-- Merge the blur with the original sharp line to get a bright core + soft edge -->
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="blur" /> <!-- Double merge for higher bloom intensity -->
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <path class="osc-line" id="wavePath" d="M0,50 L500,50" />
                </svg>
            </div>
        </div>

        <!-- Metric Zone 1 -->
        <div class="data-zone">
            <div class="zone-header">
                <span>[ PHASE_VAR ]</span>
            </div>
            <div class="metric-value" id="phaseMetric">0.048<span class="blinking-cursor">_</span></div>
            <div class="metric-sub">RAD // TOLERANCE 0.05</div>
        </div>

        <!-- Metric Zone 2 -->
        <div class="data-zone">
            <div class="zone-header">
                <span>[ HARMONIC_DIST ]</span>
            </div>
            <div class="metric-value" id="distMetric">1.22%</div>
            <div class="metric-sub">THD // NOMINAL</div>
        </div>

    </div>

    <script>
        const wavePath = document.getElementById('wavePath');
        const phaseMetric = document.getElementById('phaseMetric');
        const distMetric = document.getElementById('distMetric');
        
        const width = 500;
        const height = 100;
        const centerY = height / 2;
        let time = 0;

        // Procedural Waveform Generator
        function drawWave() {
            let path = `M 0,${centerY} `;
            
            for (let x = 0; x <= width; x += 5) {
                // Combine a slow sine wave with high-frequency noise for an active oscilloscope look
                const slowWave = Math.sin((x * 0.02) + time) * 15;
                const fastNoise = (Math.random() - 0.5) * 12;
                const heartbeat = Math.exp(-Math.pow((x - (time * 100) % width) / 15, 2)) * -40; // Pulsing spike
                
                const y = centerY + slowWave + fastNoise + heartbeat;
                
                path += `L ${x},${y.toFixed(1)} `;
            }
            
            wavePath.setAttribute('d', path);
            time += 0.05;

            // Occasionally update the metrics for diegetic realism
            if (Math.random() > 0.95) {
                const p = (0.040 + Math.random() * 0.015).toFixed(3);
                phaseMetric.innerHTML = `${p}<span class="blinking-cursor">_</span>`;
            }
            if (Math.random() > 0.97) {
                const d = (1.20 + Math.random() * 0.1).toFixed(2);
                distMetric.innerText = `${d}%`;
            }

            requestAnimationFrame(drawWave);
        }

        // Start the CRT loop
        drawWave();
    </script>
</body>
</html>
